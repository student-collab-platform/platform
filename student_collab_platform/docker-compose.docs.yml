services:
  docs:
    image: student_collab_platform_local_docs
    container_name: student_collab_platform_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./student_collab_platform:/app/student_collab_platform:z
    ports:
      - '9000:9000'
    command: /start-docs
